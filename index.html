const MAT=[["Law of Contract",[["Formation","An agreement needs offer, acceptance, consideration (or cause in civil-law systems) and an intention to create legal relations."],["Capacity and consent","Parties must have legal capacity. Consent can be undermined by misrepresentation, mistake, duress, undue influence or fraud."],["Terms","Terms are classified as conditions, warranties or intermediate terms. Exclusion clauses are read strictly against the party relying on them."],["Breach and remedies","Damages aim to put the innocent party where performance would have left them. Specific performance and injunctions are discretionary."]]],["Law of Torts",[["Negligence","The claimant must show a duty of care, breach of that duty, factual and legal causation, and damage that is not too remote."],["Strict liability","Some wrongs, such as defective products or hazardous activities, create liability without proof of fault."],["Nuisance and defamation","Nuisance protects the use and enjoyment of land. Defamation protects reputation against false statements."],["Defences and remedies","Common defences include consent, necessity and contributory negligence. Remedies are mainly damages and injunctions."]]],["Constitutional Law",[["Separation of powers","Legislative, executive and judicial functions are divided so that no single body holds all state power."],["Rule of law","Government acts must have legal authority, and laws should be clear, public and applied equally."],["Fundamental rights","Rights such as equality, liberty and free expression may be limited only by law, often tested by proportionality."],["Judicial review","Courts examine whether laws and official acts comply with the constitution and with legal limits on power."]]],["Criminal Law",[["Elements of an offence","Most crimes need a prohibited act or omission (actus reus) and a required mental state (mens rea)."],["Defences","General defences include self-defence, duress, insanity and intoxication, each with its own limits."],["Inchoate offences","Attempt, conspiracy and incitement punish steps taken towards a crime even if it is not completed."],["Burden of proof","The prosecution must prove guilt beyond reasonable doubt, and the accused is presumed innocent."]]],["Intellectual Property Law",[["Patents","An invention must be new, involve an inventive step and be capable of industrial application."],["Trade marks","A sign must be distinctive and not likely to confuse consumers with an earlier mark."],["Copyright","Protects original expression, not bare ideas. In most countries it arises automatically on creation."],["Designs and trade secrets","Registered designs protect appearance. Trade secrets are protected while they stay confidential and have commercial value."]]],["Company Law",[["Separate legal personality","A company is a legal person distinct from its members, as established in Salomon v A Salomon & Co (1897)."],["Directors\u2019 duties","Directors must act with care and skill, in good faith for the company, and avoid conflicts of interest."],["Shareholder protection","Members have voting rights and remedies, including protection against unfair prejudice to minorities."],["Insolvency","When a company cannot pay its debts it may be wound up or restructured under insolvency law."]]],["Taxation Law",[["Direct and indirect taxes","Direct taxes fall on income or profits. Indirect taxes such as GST and VAT are charged on supplies of goods and services."],["Residence and source","Countries tax on residence, source of income or both, and double tax treaties reduce overlap."],["Avoidance and evasion","Avoidance uses the law to reduce tax, sometimes limited by anti-avoidance rules. Evasion is illegal concealment."],["GST and VAT mechanics","Tax is charged on a taxable supply and businesses generally claim input tax credit on tax paid on purchases."]]],["International Law",[["Sources","Treaties, customary international law and general principles are the main sources listed in Ar
